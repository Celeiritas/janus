# argus-limits.conf: the resource limits every agent task in an Argus home gets (the same drop-in argus-ui, Hermes and
# Zeus use): a quarter of one core, 512 MB, low I/O weight, nice 10. It goes in
# ~/.config/systemd/user/janus-map.service.d/ (the lines in janus-map.timer say how).
[Service]
CPUQuota=25%
MemoryMax=512M
IOWeight=50
Nice=10
